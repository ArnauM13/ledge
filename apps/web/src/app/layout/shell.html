<div class="t-flex t-min-h-screen t-flex-col md:t-flex-row">
  <header
    class="t-flex t-items-center t-justify-between t-border-b t-border-line t-bg-surface t-px-4 t-py-3 md:t-hidden"
  >
    <span class="t-text-lg t-font-semibold t-tracking-tight">ledge</span>
    <button
      type="button"
      class="t-rounded-md t-px-3 t-py-1.5 t-text-sm t-text-content-muted hover:t-bg-surface-raised hover:t-text-content"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="main-nav"
      (click)="toggleMenu()"
    >
      Menu
    </button>
  </header>

  <nav
    id="main-nav"
    aria-label="Main"
    class="t-border-line t-bg-surface md:t-block md:t-w-60 md:t-shrink-0 md:t-border-r"
    [class.t-hidden]="!menuOpen()"
  >
    <div class="t-hidden t-px-5 t-pb-4 t-pt-6 md:t-block">
      <span class="t-text-lg t-font-semibold t-tracking-tight">ledge</span>
    </div>
    <ul class="t-flex t-flex-col t-gap-0.5 t-p-2">
      @for (item of navItems; track item.path) {
      <li>
        <a
          [routerLink]="['/', item.path]"
          routerLinkActive="t-bg-surface-raised !t-text-content"
          ariaCurrentWhenActive="page"
          class="t-block t-rounded-md t-px-3 t-py-2 t-text-sm t-text-content-muted hover:t-bg-surface-raised hover:t-text-content"
          (click)="closeMenu()"
          >{{ item.label }}</a
        >
      </li>
      }
    </ul>
  </nav>

  <main class="t-flex-1 t-px-4 t-py-6 md:t-px-10 md:t-py-10">
    <router-outlet />
  </main>
</div>
