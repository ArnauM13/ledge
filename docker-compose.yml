# Local development stack: PostgreSQL + API.
#
#   cp .env.example .env
#   mkdir -p secrets && openssl rand -base64 32 > secrets/postgres_password
#   openssl rand -base64 32 > secrets/ledge_master_key
#   docker compose up --build
#
# Startup order: db (healthy) -> migrate (prisma migrate deploy, exits 0) -> api.
#
# Secrets are files mounted at /run/secrets/* (never environment variables),
# so they do not show up in `docker inspect`, `docker compose config` or logs.
# Postgres has NO published ports: it is only reachable from the `backend`
# network, which is internal (no traffic to or from the host/internet).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending Prisma migrations and exits. Also runnable on its own:
  #   docker compose run --rm migrate
  migrate:
    image: ledge-api-migrate:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend

  api:
    image: ledge-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # Connection settings without the password. The API builds the URL at
      # startup and reads the password from DB_PASSWORD_FILE.
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      # AES-256-GCM master key (32 bytes, base64) as a file. The API refuses
      # to start if it is missing or invalid. The version is not secret: it is
      # written in every ciphertext so the key can be rotated.
      LEDGE_MASTER_KEY_FILE: /run/secrets/ledge_master_key
      LEDGE_MASTER_KEY_VERSION: ${LEDGE_MASTER_KEY_VERSION:-1}
      # Extra origins allowed to send state-changing requests (CSRF check),
      # comma-separated. Same-origin requests are always allowed.
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      # Number of reverse-proxy hops to trust for the client IP (rate limits).
      # Empty = X-Forwarded-For is ignored.
      API_TRUST_PROXY: ${API_TRUST_PROXY:-}
    secrets:
      - postgres_password
      - ledge_master_key
    ports:
      # Bound to localhost only.
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    networks:
      - backend
      - edge

secrets:
  postgres_password:
    # Git-ignored. Compose refuses to start if the file is missing.
    file: ./secrets/postgres_password
  ledge_master_key:
    # Git-ignored. `openssl rand -base64 32 > secrets/ledge_master_key`
    file: ./secrets/ledge_master_key

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db-data:
