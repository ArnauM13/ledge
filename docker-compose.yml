# Local development stack: PostgreSQL + API.
#
#   cp .env.example .env
#   mkdir -p secrets && openssl rand -base64 32 > secrets/postgres_password
#   docker compose up --build
#
# Secrets are files mounted at /run/secrets/* (never environment variables),
# so they do not show up in `docker inspect`, `docker compose config` or logs.
# Postgres has NO published ports: it is only reachable from the `backend`
# network, which is internal (no traffic to or from the host/internet).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ledge-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      # Connection settings without the password. The password is read from
      # DB_PASSWORD_FILE (not used yet: Prisma arrives in Phase 1, point 4).
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      # Bound to localhost only.
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    networks:
      - backend
      - edge

secrets:
  postgres_password:
    # Git-ignored. Compose refuses to start if the file is missing.
    file: ./secrets/postgres_password

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db-data:
